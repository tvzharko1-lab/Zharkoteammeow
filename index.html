<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Posture Guard</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="brand">
        <div id="header-dot" class="status-dot green"></div>
        <h1>Posture Guard</h1>
        <small>AI</small>
      </div>
      <div class="header-actions">
        <span id="status" class="badge">Загрузка...</span>
      </div>
    </header>
    <main class="grid">
      <section id="main-video-card" class="card video-card">
        <div class="video-container">
          <video id="webcam" autoplay playsinline muted></video>
          <canvas id="output_canvas"></canvas>
          <div id="gesture-badge" class="video-tag">Поза ровная</div>
        </div>
        <div style="display: flex; gap: 8px;">
          <button id="calibrate-btn" class="btn btn-primary" style="flex: 1;">Калибровка</button>
          <button id="pip-btn" class="btn btn-secondary">PiP</button>
        </div>
      </section>
      <aside class="stats-column">
        <div id="alert-box" class="card alert-card">
          <span id="alert-text" class="alert-title">Всё отлично, поза ровная.</span>
        </div>
        <div class="timeframe-card card">
          <span class="timeframe-label">Период:</span>
          <div class="timeframe-tabs">
            <button class="tab-btn active" data-time="10m">10 мин</button>
            <button class="tab-btn" data-time="30m">30 мин</button>
            <button class="tab-btn" data-time="1h">1 час</button>
          </div>
        </div>
        <div class="counters-grid" style="grid-template-columns: repeat(2, 1fr);">
          <div class="card counter-card red-border">
            <span class="counter-label">Сутулость</span>
            <span id="count-slouch" class="counter-value">0</span>
          </div>
          <div class="card counter-card yellow-border">
            <span class="counter-label">Зевки</span>
            <span id="count-yawn" class="counter-value">0</span>
          </div>
          <div class="card counter-card orange-border">
            <span class="counter-label">Дистанция</span>
            <span id="count-distance" class="counter-value">0</span>
          </div>
          <div class="card counter-card blue-border">
            <span class="counter-label">Калибровки</span>
            <span id="count-calib" class="counter-value">0</span>
          </div>
        </div>
        <div class="card metric-card">
          <div class="metric-head">
            <span>Осанка</span>
            <span id="posture-status" class="status-text good">ОК</span>
          </div>
          <div class="progress-bg">
            <div id="bar-posture" class="progress-fill" style="width: 100%;"></div>
          </div>
        </div>
        <div class="card metric-card">
          <div class="metric-head">
            <span>Моргания (за мин)</span>
            <span id="blink-count" class="metric-value">0</span>
          </div>
          <span class="metric-sub">Норма: 12-20</span>
        </div>
      </aside>
    </main>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
